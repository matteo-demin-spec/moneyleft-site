<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata &middot; MoneyLeft</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/moneyleft-site/img/icona-32.png">
<link rel="apple-touch-icon" href="/moneyleft-site/img/icona-180.png">
<style>
  :root{--sfondo:#080a14;--sfondo-2:#0d1020;--testo:#f2f4fb;--tenue:#9aa2bd;--viola:#8b5cf6;--azzurro:#3b82f6;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--testo);line-height:1.6;-webkit-font-smoothing:antialiased;
    background:radial-gradient(60% 55% at 20% 10%,rgba(139,92,246,.20),transparent 70%),
               radial-gradient(55% 50% at 85% 80%,rgba(59,130,246,.16),transparent 70%),
               linear-gradient(160deg,var(--sfondo-2),var(--sfondo));}
  .box{max-width:520px;text-align:center;}
  img{width:76px;height:76px;border-radius:19px;margin:0 auto 26px;display:block;}
  h1{font-size:clamp(1.7rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin:0 0 12px;line-height:1.15;}
  p{color:var(--tenue);margin:0 0 28px;}
  a.btn{display:inline-block;background:linear-gradient(135deg,var(--viola),var(--azzurro));color:#fff;font-weight:700;
    border-radius:12px;padding:13px 24px;text-decoration:none;}
  .altri{margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.10);font-size:.92rem;}
  .altri a{color:var(--tenue);font-weight:600;text-decoration:none;margin:0 9px;}
  .altri a:hover{color:var(--testo);}
</style>
</head>
<body>
  <div class="box">
    <img src="/moneyleft-site/img/icona-180.png" alt="MoneyLeft">
    <h1>Questa pagina non esiste</h1>
    <p>Forse il link è vecchio o contiene un errore di battitura. Dalla home trovi tutto quello che c'è.</p>
    <a class="btn" href="/moneyleft-site/">Torna alla home</a>
    <div class="altri">
      <a href="/moneyleft-site/assistenza.html">Assistenza</a>
      <a href="/moneyleft-site/privacy.html">Privacy</a>
      <a href="/moneyleft-site/termini.html">Termini</a>
    </div>
  </div>
</body>
</html>
