  @font-face{
    font-family:"Manrope"; font-style:normal; font-weight:400 800; font-display:swap;
    src:url("font/manrope-latin-ext.woff2") format("woff2");
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;

  :root{--sfondo:#080a14;--sfondo-2:#0d1020;--testo:#f2f4fb;--tenue:#9aa2bd;--viola:#8b5cf6;--azzurro:#3b82f6;}

  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;

               linear-gradient(160deg,var(--sfondo-2),var(--sfondo));}
  .box{max-width:520px;text-align:center;}
  img{width:76px;height:76px;border-radius:19px;margin:0 auto 26px;display:block;}
  h1{font-size:clamp(1.7rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin:0 0 12px;line-height:1.15;}
  p{color:var(--tenue);margin:0 0 28px;}
  a.btn{display:inline-block;background:linear-gradient(135deg,var(--viola),var(--azzurro));color:#fff;font-weight:700;

  .altri{margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.10);font-size:.92rem;}
  .altri a{color:var(--tenue);font-weight:600;text-decoration:none;margin:0 9px;}
